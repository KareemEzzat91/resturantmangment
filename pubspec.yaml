name: resturantmangment
description: "A Flutter restaurant management platform for discovery, reservations, menus, tables, payments, and administration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_side_menu: ^0.5.41
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  carousel_slider: ^5.0.0
  anim_search_bar: ^2.0.3
  salomon_bottom_bar: ^3.3.2
  eva_icons_flutter: ^3.1.0
  dio: ^5.8.0+1
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  font_awesome_flutter: ^10.8.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  animate_do: ^4.1.1
  google_maps_flutter: ^2.10.1
  shared_preferences: ^2.5.2
  quickalert: ^1.1.0
  animated_text_kit: ^4.2.2
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
